<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login - Password Manager</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

    <div class="container">

        <h1>🔐 Password Manager</h1>

        <p class="subtitle">
            Login to your account
        </p>


        <div class="card">

            {% if error %}
                <p class="error">
                    {{ error }}
                </p>
            {% endif %}


            <form method="POST">

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    required
                    autocomplete="username"
                >


                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    required
                    autocomplete="current-password"
                >


                <button
                    type="submit"
                    class="analyze">

                    Login

                </button>

            </form>


            <p>
                Don't have an account?
                <a href="{{ url_for('register') }}">
                    Register
                </a>
            </p>


            <p>
                <a href="{{ url_for('index') }}">
                    Back to Password Analyzer
                </a>
            </p>

        </div>

    </div>

</body>

</html>
